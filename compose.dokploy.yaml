services:
  app:
    build: .
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      PORT: 3001
      MONGO_URI: ${MONGO_URI:?Set MONGO_URI in Dokploy}
      MONGO_DB: ${MONGO_DB:-deshi_tycoon}
      SOKETI_HOST: soketi
      SOKETI_PORT: 6001
      SOKETI_APP_ID: ${SOKETI_APP_ID:?Set SOKETI_APP_ID in Dokploy}
      SOKETI_APP_KEY: ${SOKETI_APP_KEY:?Set SOKETI_APP_KEY in Dokploy}
      SOKETI_APP_SECRET: ${SOKETI_APP_SECRET:?Set SOKETI_APP_SECRET in Dokploy}
    depends_on:
      soketi:
        condition: service_healthy
    expose:
      - "3001"
    stop_grace_period: 20s

  soketi:
    build:
      context: .
      dockerfile: docker/soketi.Dockerfile
    restart: unless-stopped
    init: true
    environment:
      REDIS_URI: ${REDIS_URI:?Set REDIS_URI in Dokploy}
      SOKETI_APP_ID: ${SOKETI_APP_ID:?Set SOKETI_APP_ID in Dokploy}
      SOKETI_APP_KEY: ${SOKETI_APP_KEY:?Set SOKETI_APP_KEY in Dokploy}
      SOKETI_APP_SECRET: ${SOKETI_APP_SECRET:?Set SOKETI_APP_SECRET in Dokploy}
    expose:
      - "6001"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:6001/ready', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 5
